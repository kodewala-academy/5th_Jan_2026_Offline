spring.application.name=04-irctc-booking

server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/5th_jan_2026_batch
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/5th_jan_2026_batch
spring.datasource.username=root
spring.datasource.password=Test@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.application.name=Payment Service
info.application.description=IRCTC Payment Microservice
info.application.version=1.0.0



bootstrap.servers=localhost:9092

# Serializer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer

